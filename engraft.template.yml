variables:
  title_short:
    description: Short app title
    default: Animals
  title:
    description: App title
    default: Animals Audioguide
  description:
    description: App description
    default: A sample audioguide app for animals
  lang:
    description: Language code for manifest.json
    default: en
  data_url:
    description: URL to the audioguide data JSON
    default: https://smartcompanion-app.github.io/data-format/animals/data.json
  offline_support:
    description: Enable offline support (true/false)
    default: "false"
  messaging_support:
    description: Enable messaging support / postMessage listener (true/false)
    default: "true"
  background_color:
    description: App background color
    default: "#faefdc"
  background_color_dark:
    description: App background color (dark mode), optional - derived from background_color when unset
  card_background_color:
    description: Card background color, optional - derived from background_color when unset
  card_background_color_dark:
    description: Card background color (dark mode), optional - derived from background_color_dark when unset
  station_icon_progress_color:
    description: Station icon progress color, optional - derived from primary_color when unset
  station_icon_progress_color_dark:
    description: Station icon progress color (dark mode), optional - derived from primary_color when unset
  menu_border_color:
    description: Menu item border color, optional - derived from background_color when unset
  menu_border_color_dark:
    description: Menu item border color (dark mode), optional - derived from background_color_dark when unset
  primary_color:
    description: Primary brand color
    default: "#8fc0bd"
  primary_color_contrast:
    description: Text color on primary color
    default: "#ffffff"
  light_color:
    description: Light color, optional - derived from background_color when unset
  light_color_dark:
    description: Light color (dark mode), optional - derived from background_color_dark when unset
  logo:
    description: Path to app logo image
    default: src/assets/logo.png
  logo_dark:
    description: Path to app logo image (dark mode)
    default: src/assets/logo-dark.png
  icon_source:
    description: Path to the source image the whole PWA icon set is generated from
    default: src/icon.png
  icon_background:
    description: Colour behind the padded artwork on the maskable and Apple icons, optional - sampled from the source image when unset

customizations:
  - action: regex_replace
    file: stencil.config.ts
    replace:
      - selector: '(const TITLE\s*=\s*")(?P<value>[^"]*)'
        variable: title
      - selector: '(const DATA_URL\s*=\s*")(?P<value>[^"]*)'
        variable: data_url
      - selector: '(process\.env\.OFFLINE_SUPPORT\s*===\s*''true''\s*\|\|\s*)(?P<value>\w+)'
        variable: offline_support
      - selector: '(const MESSAGING_SUPPORT\s*=\s*)(?P<value>\w+)'
        variable: messaging_support

  - action: html_replace
    file: src/index.html
    replace:
      - selector: //title
        variable: title
      - selector: //meta[@name='Description']/@content
        variable: description
      - selector: '//meta[@name=''theme-color'' and @media="(prefers-color-scheme: light)"]/@content'
        variable: background_color
      - selector: '//meta[@name=''theme-color'' and @media="(prefers-color-scheme: dark)"]/@content'
        variable: background_color_dark
      - selector: //html/@lang
        variable: lang

  - action: json_replace
    file: src/manifest.json
    replace:
      - selector: $.name
        variable: title
      - selector: $.short_name
        variable: title_short
      - selector: $.description
        variable: description
      - selector: $.lang
        variable: lang
      - selector: $.background_color
        variable: background_color
      - selector: $.theme_color
        variable: background_color

  - action: regex_replace
    file: src/global/app.scss
    replace:
      - selector: '(\$background-color:\s*)(?P<value>[^;]+)'
        variable: background_color
      - selector: '(\$background-color-dark:\s*)(?P<value>[^;]+)'
        variable: background_color_dark
      - selector: '(\$card-background-color:\s*)(?P<value>[^;]+)'
        variable: card_background_color
      - selector: '(\$card-background-color-dark:\s*)(?P<value>[^;]+)'
        variable: card_background_color_dark
      - selector: '(\$station-icon-progress-color:\s*)(?P<value>[^;]+)'
        variable: station_icon_progress_color
      - selector: '(\$station-icon-progress-color-dark:\s*)(?P<value>[^;]+)'
        variable: station_icon_progress_color_dark
      - selector: '(\$menu-border-color:\s*)(?P<value>[^;]+)'
        variable: menu_border_color
      - selector: '(\$menu-border-color-dark:\s*)(?P<value>[^;]+)'
        variable: menu_border_color_dark
      - selector: '(\$primary-color:\s*)(?P<value>[^;]+)'
        variable: primary_color
      - selector: '(\$primary-color-contrast:\s*)(?P<value>[^;]+)'
        variable: primary_color_contrast
      - selector: '(\$light-color:\s*)(?P<value>[^;]+)'
        variable: light_color
      - selector: '(\$light-color-dark:\s*)(?P<value>[^;]+)'
        variable: light_color_dark

  - action: file_replace
    file: src/assets/logo.png
    variable: logo

  - action: file_replace
    file: src/assets/logo-dark.png
    variable: logo_dark

  # The icons are generated from icon_source at build time rather than replaced as
  # files, so this is a path written into the script -- repo-relative, like data_url,
  # not relative to the values file the way file_replace paths are.
  - action: regex_replace
    file: scripts/generate-icons.mjs
    replace:
      - selector: '(const ICON_SOURCE\s*=\s*")(?P<value>[^"]*)'
        variable: icon_source
      - selector: '(const ICON_BACKGROUND\s*=\s*")(?P<value>[^"]*)'
        variable: icon_background
