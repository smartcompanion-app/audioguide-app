name: release

on:
  release:
    types: [published]
  # Redeploy an arbitrary tag on demand. The deploy rebuilds from that ref
  # rather than re-serving a stored artifact, which only reproduces the original
  # because `npm ci` resolves against that ref's package-lock.json.
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag (or commit SHA) to deploy, e.g. v2026-05-08'
        required: true

# Two deploys racing each other would fight over the Pages environment, and
# cancelling a half-finished one can leave the site mid-swap.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  NODE_VERSION: 22
  # A release event checks out the tagged commit by default, but a manual
  # dispatch has no such default, so the ref is pinned explicitly for both. It
  # doubles as the version stamped into the built pages.
  DEPLOY_REF: ${{ github.event.inputs.ref || github.event.release.tag_name }}

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-24.04
    steps:
      # Releases are tagged by date, so a second release on the same day
      # collides and has to carry a `.N` suffix. Checking the format here keeps
      # that from being folklore: `.1` is known-good, and a near miss like
      # v2026-05-08-1 fails instead of shipping under a tag nothing recognises.
      #
      # The release is already published by the time this runs, so failing does
      # not unpublish it -- it stops the deploy and leaves the tag to be fixed.
      # Only checked for release events; a dispatch redeploys a ref that already
      # exists and is allowed to be a plain commit SHA.
      - name: Validate release tag
        if: github.event_name == 'release'
        run: |
          if ! echo "$DEPLOY_REF" | grep -Eq '^v[0-9]{4}-[0-9]{2}-[0-9]{2}(\.[0-9]+)?$'; then
            echo "::error::Release tag '$DEPLOY_REF' must be vYYYY-MM-DD, or vYYYY-MM-DD.N for a second release on the same day (e.g. v2026-05-08, v2026-05-08.1)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_REF }}

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run offline tests
        run: npm run test:offline

  deploy:
    name: Deploy to Pages
    needs: test
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_REF }}

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Stamped before either variant is built, and deliberately not afterwards:
      # with OFFLINE_SUPPORT on, Workbox computes its precache revisions during
      # the build, so editing www/index.html after it would leave the revision
      # for index.html unchanged and clients would never pick the new version up.
      # The grep fails the deploy if the placeholder is ever renamed, which would
      # otherwise silently ship "dev" to production.
      - name: Stamp version
        run: |
          sed -i "s|<meta name=\"version\" content=\"dev\" />|<meta name=\"version\" content=\"$DEPLOY_REF\" />|" src/index.html
          grep -q "<meta name=\"version\" content=\"$DEPLOY_REF\" />" src/index.html

      # Build default "animals" variant
      - run: npm run build
      - run: |
          sed -i 's|"/build/|"build/|g' www/index.html
          sed -i "s|'/sw.js'|'/audioguide-app/animals/sw.js'|" www/index.html
      - run: mv www animals

      # Build "leon" variant via engraft
      - run: npx engraft apply --template engraft.template.yml --values customization/leon/engraft.variables.yml
      # engraft rewrites src/index.html through an HTML parser, so the version
      # meta tag is re-checked here rather than assumed to survive.
      - run: |
          grep -q 'Leon Audioguide' src/index.html
          grep -q "name=\"version\" content=\"$DEPLOY_REF\"" src/index.html
      - run: npm run build
      - run: |
          sed -i 's|"/build/|"build/|g' www/index.html
          sed -i "s|'/sw.js'|'/audioguide-app/leon/sw.js'|" www/index.html
      - run: mv www leon

      # Assemble deployment directory
      - run: |
          mkdir _site
          mv animals _site/animals
          mv leon _site/leon

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
